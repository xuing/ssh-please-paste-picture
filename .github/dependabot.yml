# Keeps the SHA-pinned actions in .github/workflows current. Pester and
# PSScriptAnalyzer are pinned in tests/tools.ps1; the weekly CI run tries the newest.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ['*']
