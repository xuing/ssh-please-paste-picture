name: Publish

# Plans, builds, signs and publishes the release of a commit that CI tested. It runs only
# when ci.yml calls it, after CI passed on a push to main (or on a manual CI run on main).
#
# One release at a time: the group "release" is the lock, and the planning happens inside
# it. A run that waits is replaced by a newer waiting one, which is fine: only the newest
# commit of main releases, and it releases everything before it too.
#
# The jobs, in order:
#   plan     stop unless origin/main is the tested commit; tag it v0.1.<n> (or reuse the tag
#            it already has) unless src/, install.ps1 and install.sh are as in the last release
#   build    stamp the version into ssh-paste.ps1 and ssh-paste.js, bake the tag into
#            install.ps1 and install.sh, write SHA256SUMS and the release notes
#   attest   sign a build provenance attestation for the seven files
#   release  publish-release.sh: draft, download and check it, only then publish it
#   homebrew make the formula in the tap xuing/homebrew-tap the one homebrew-formula.sh writes
#            for the Latest release, also when this commit released nothing
#   homebrew-check  when the formula changed, on a Mac: brew install xuing/tap/ssh-paste, brew test
# The install.ps1 and install.sh attached to the release have their default ref set to the
# tag, so
#   irm https://github.com/xuing/ssh-please-paste-picture/releases/latest/download/install.ps1 | iex
#   curl -fsSL https://github.com/xuing/ssh-please-paste-picture/releases/latest/download/install.sh | sh
# install the stamped, attested files of exactly that release. The copies in the repository
# keep main and install src/. The version in the repository is 0.0.0-dev.
# Every step can be run again ("Re-run failed jobs"): see docs/RELEASING.md.
on:
  workflow_call:
    inputs:
      sha:
        description: 'The commit that CI tested: github.sha of the calling run.'
        required: true
        type: string
    secrets:
      # A secret of the environment homebrew-tap, which only main can use. The caller must
      # still pass it by name: one that is not passed reads as an empty string here.
      HOMEBREW_TAP_DEPLOY_KEY:
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash   # with pipefail: a failing gh in a pipeline fails the step

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # to push the tag
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          # The script pushes the tag with this token.
          persist-credentials: true

      - name: Tag the tested commit
        id: plan
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/plan-release.sh

  build:
    name: Build the release files
    needs: plan
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      # Full history and all tags: the release notes list the commits since the previous release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: The tag is a version and points at the commit that was tested
        env:
          SHA: ${{ inputs.sha }}
        run: |
          . .github/scripts/lib.sh
          [[ "$TAG" =~ $TAG_RE ]] || { echo "::error::tag $TAG is not a version like v0.1.7"; exit 1; }
          head=$(git rev-parse HEAD)
          echo "$TAG is $head; tested: $SHA"
          [ "$head" = "$SHA" ] || { echo "::error::tag $TAG points at $head, not at the tested commit $SHA"; exit 1; }

      - name: Collect the files and their SHA-256 sums
        run: |
          mkdir -p out/dist
          cp src/ssh-paste.cmd install.ps1 out/dist/
          # The release copy of the script says its own version; the repository's says 0.0.0-dev.
          bash .github/scripts/stamp-version.sh src/ssh-paste.ps1 out/dist/ssh-paste.ps1 "${TAG#v}"
          # Bake the tag into the attached installer: its default ref ($DefaultRef,
          # main in the repository) becomes the tag, and it then installs the files of
          # this release. The tag was checked above, so it is safe inside the sed
          # replacement. CRLF checkouts: the match stops before the line ending.
          sed -i "s/^\( *[$]DefaultRef = \)'main'/\1'$TAG'/" out/dist/install.ps1
          baked=$(tr -d '\r' < out/dist/install.ps1 | grep -cxF "    \$DefaultRef = '$TAG'" || true)
          leftover=$(grep -c "'main'" out/dist/install.ps1 || true)
          echo "install.ps1: default ref lines set to $TAG: $baked; 'main' left: $leftover"
          [ "$baked" = 1 ] && [ "$leftover" = 0 ] || {
            echo "::error::could not set the default ref of out/dist/install.ps1 to $TAG"
            exit 1
          }
          pwsh -NoProfile -Command '$e = $null; [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD.Path "out/dist/install.ps1"), [ref]$null, [ref]$e); if ($e) { $e | ForEach-Object { Write-Host $_ }; exit 1 }'
          # The macOS client: the launcher as it is, ssh-paste.js stamped like ssh-paste.ps1, and
          # install.sh with the tag as its DEFAULT_REF (main in the repository), checked the same way.
          cp src/ssh-paste-mac install.sh out/dist/
          bash .github/scripts/stamp-version.sh src/ssh-paste.js out/dist/ssh-paste.js "${TAG#v}"
          sed -i "s/^DEFAULT_REF='main'\$/DEFAULT_REF='$TAG'/" out/dist/install.sh
          baked=$(grep -cxF "DEFAULT_REF='$TAG'" out/dist/install.sh || true)
          leftover=$(grep -c "'main'" out/dist/install.sh || true)
          echo "install.sh: default ref lines set to $TAG: $baked; 'main' left: $leftover"
          [ "$baked" = 1 ] && [ "$leftover" = 0 ] || {
            echo "::error::could not set the default ref of out/dist/install.sh to $TAG"
            exit 1
          }
          sh -n out/dist/install.sh
          (cd out/dist && sha256sum ssh-paste.ps1 ssh-paste.cmd install.ps1 ssh-paste.js ssh-paste-mac install.sh > SHA256SUMS)
          cat out/dist/SHA256SUMS

      # The notes are the subjects of the commits since the previous release, then the
      # install block. A commit subject is the release note: it says what a user now sees.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" > out/notes.md
          echo "---- notes.md"
          cat out/notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out
          if-no-files-found: error
          retention-days: 7

  # The only job with id-token and attestations permissions. It signs the exact
  # bytes that the release job publishes (the same artifact).
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/dist/install.ps1
            out/dist/ssh-paste.ps1
            out/dist/ssh-paste.cmd
            out/dist/install.sh
            out/dist/ssh-paste.js
            out/dist/ssh-paste-mac
            out/dist/SHA256SUMS

  release:
    name: Release ${{ needs.plan.outputs.tag }}
    needs: [plan, build, attest]
    if: needs.plan.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.plan.outputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - name: Publish the release, after checking its draft
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/publish-release.sh "$TAG" out/dist out/notes.md

  # brew install xuing/tap/ssh-paste installs the Latest release's own files: the formula points
  # at its ssh-paste.js and ssh-paste-mac and checks them against its attested SHA256SUMS. It runs
  # after every release run, so a fix to the formula reaches the tap without a new release. The
  # deploy key, which can write to the tap and nothing else, is a secret of the environment
  # homebrew-tap, which only main can use.
  homebrew:
    name: Sync the Homebrew tap
    needs: [plan, release]
    if: always() && needs.plan.result == 'success' && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homebrew-tap
    permissions:
      contents: read
    outputs:
      version: ${{ steps.formula.outputs.version }}
      changed: ${{ steps.formula.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      # Without the key, checkout falls back to github.token, which cannot push to the tap.
      - name: The deploy key of the tap is set
        env:
          KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: '[ -n "$KEY" ] || { echo "::error::HOMEBREW_TAP_DEPLOY_KEY is empty: is it passed by name in ci.yml and set in the environment homebrew-tap?"; exit 1; }'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: xuing/homebrew-tap
          path: tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          persist-credentials: true

      - name: Write the formula of the Latest release and push it if it changed
        id: formula
        env:
          SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          . .github/scripts/lib.sh
          echo "changed=false" >> "$GITHUB_OUTPUT"
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" -q .sha)
          if [ "$head" != "$SHA" ]; then echo "main is at $head now; its own run syncs the tap"; exit 0; fi
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name)
          [[ "$latest" =~ $TAG_RE ]] || { echo "::error::the Latest release is $latest"; exit 1; }
          echo "version=${latest#v}" >> "$GITHUB_OUTPUT"
          gh release download "$latest" -p SHA256SUMS -D out
          gh attestation verify out/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml"
          mkdir -p tap/Formula
          bash .github/scripts/homebrew-formula.sh "${latest#v}" "https://github.com/$GITHUB_REPOSITORY/releases/download/$latest" out/SHA256SUMS > tap/Formula/ssh-paste.rb
          cat tap/Formula/ssh-paste.rb
          cd tap
          git add Formula/ssh-paste.rb
          if git diff --cached --quiet; then echo "the tap already has this formula for $latest"; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "ssh-paste ${latest#v}" -m "Written by $GITHUB_REPOSITORY@$SHA"
          git push origin HEAD
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # What a user gets: brew install from the tap on GitHub, as a user runs it.
  homebrew-check:
    name: Install from the Homebrew tap
    needs: homebrew
    if: always() && needs.homebrew.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    permissions: {}
    env:
      VERSION: ${{ needs.homebrew.outputs.version }}
      HOMEBREW_NO_ANALYTICS: 1
      HOMEBREW_NO_ENV_HINTS: 1
    steps:
      - name: brew install xuing/tap/ssh-paste
        run: |
          brew install xuing/tap/ssh-paste
          got=$("$(brew --prefix)/bin/ssh-paste" --version)
          echo "ssh-paste --version: $got; the tap should have $VERSION"
          [ "$got" = "$VERSION" ] || { echo "::error::brew installed $got, not $VERSION"; exit 1; }
          brew test xuing/tap/ssh-paste
