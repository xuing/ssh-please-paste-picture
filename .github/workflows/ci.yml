name: CI

# Runs on pushes to main, on every pull request and once a week. It is also the manual
# entry: "Run workflow" on main runs everything below and then releases (job "release").
#
# A green run on main ends with the job "release" (publish.yml): the commit that was tested
# is tagged v0.1.<n> and published, when it changes src/ or install.ps1 and is still the
# newest commit of main. The job lives in this file, not in a workflow that CI triggers, so
# the tag goes on exactly github.sha, the commit CI tested.
#
# The checks are scripts in the repository, so a person can run what CI runs:
#   ./check.ps1 [-E2E] [-Footprint]
# lint -> tests/lint.ps1, unit -> tests/run-pester.ps1, e2e -> tests/e2e-linux.sh,
# footprint -> tests/footprint.ps1, proxy-windows -> tests/proxy-windows.ps1.
#
# "CI ok" is the one job to require in branch protection (Settings > Branches): it
# passes only when every other job passed, however the matrix is shaped.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 04:23 UTC, with the newest Pester and PSScriptAnalyzer (TOOLS_LATEST),
    # so that a release of either that breaks us shows up here and not on a pull request.
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Only a newer push to the same pull request cancels a run. A run on main is never cancelled
# by the weekly run or a manual one: the group has the event in it, so those cannot replace
# a pending push run (which may be the one that releases).
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # tests/tools.ps1 pins Pester and PSScriptAnalyzer; the weekly run takes the newest.
  TOOLS_LATEST: ${{ github.event_name == 'schedule' }}

jobs:
  # Static checks: the files must stay ASCII and parse on Windows PowerShell 5.1,
  # which is the only PowerShell a stock Windows computer has.
  lint:
    name: Lint
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint (PowerShell 7)
        shell: pwsh
        run: |
          & ./tests/lint.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & ./tests/lint.ps1 -Check Parse
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Pure functions and, where the OS allows, real clipboard and process tests.
  # Windows has Pester 3.4 and 5.x side by side; tests/tools.ps1 imports the pinned 5.x.
  unit:
    name: Unit tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            artifact: ps51-windows
            os: windows-latest
            shell: powershell
          - name: PowerShell 7 on Windows
            artifact: ps7-windows
            os: windows-latest
            shell: pwsh
          - name: PowerShell 7 on Linux
            artifact: ps7-linux
            os: ubuntu-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Pester
        run: |
          if ($env:OS -eq 'Windows_NT') { Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force }
          & ./tests/run-pester.ps1 -Name unit-${{ matrix.artifact }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-unit-${{ matrix.artifact }}
          path: TestResults/
          if-no-files-found: ignore

  # A throwaway sshd on the runner: real uploads, the server-side script through
  # real shells, and --proxy relaying a binary file. See tests/e2e-linux.sh.
  e2e:
    name: End to end (ssh on Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell script lint
        run: |
          bash -n tests/e2e-linux.sh
          shellcheck tests/e2e-linux.sh

      # Its own step with a short limit: a stuck package mirror once held a run for hours.
      - name: Install sshd if the runner has none
        timeout-minutes: 5
        run: |
          if ! command -v sshd > /dev/null && [ ! -x /usr/sbin/sshd ]; then
            sudo timeout 240 apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive timeout 240 apt-get install -y -qq openssh-server
          fi

      - name: Run the E2E tests
        timeout-minutes: 10
        run: bash tests/e2e-linux.sh

      - name: Upload test results and the sshd log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-e2e
          path: TestResults/
          if-no-files-found: ignore

  # Install, enable, disable and uninstall must leave the profile exactly as it was.
  # Both shells run it: the Windows PowerShell that every user has, and PowerShell 7.
  footprint:
    name: Footprint (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests/footprint.ps1
        run: |
          Write-Host ('PowerShell {0} ({1})' -f $PSVersionTable.PSVersion, $PSVersionTable.PSEdition)
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & ./tests/footprint.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The real Windows ssh.exe starts the --proxy relay with overlapped pipes, which no
  # stand-in reproduces. The test serves an ssh banner from a local listener and needs
  # ssh's banner and its KEXINIT packet back through the relay; a hang fails in 30 s.
  proxy-windows:
    name: Proxy with Windows OpenSSH (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run tests/proxy-windows.ps1
        timeout-minutes: 5
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          & ./tests/proxy-windows.ps1 -TimeoutSeconds 30
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The TLA+ model of the clipboard watcher (verify/watcher): TLC checks every order of the
  # user, two sessions, a paste and the Windows clipboard within small bounds, and that each
  # broken variant of the code is still caught. The runner's own Java runs TLC; check.sh
  # downloads tla2tools.jar of a pinned release and checks its SHA-256.
  # .claude/skills/verify-clipboard-watcher/SKILL.md says how to read a failure.
  model:
    name: Model check (clipboard watcher)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell script lint
        run: |
          bash -n verify/watcher/check.sh
          shellcheck verify/watcher/check.sh

      - name: Run TLC
        run: |
          java -version
          bash verify/watcher/check.sh --mutants --keep "$RUNNER_TEMP/tlc"

      - name: Upload the TLC output
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlc-output
          path: ${{ runner.temp }}/tlc/
          if-no-files-found: ignore

  # The single required check. Skipped, cancelled and failed jobs all count as failure.
  ci-ok:
    name: CI ok
    if: always()
    needs: [lint, unit, e2e, footprint, proxy-windows, model]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null

  # A green run on main releases its commit. The rules, and the lock that lets one release run
  # at a time, are in publish.yml and docs/RELEASING.md. "Run workflow" on main is the manual
  # way: it asks for the same thing for the newest commit of main.
  release:
    name: Release
    needs: ci-ok
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: ./.github/workflows/publish.yml
    with:
      sha: ${{ github.sha }}
    permissions:
      contents: write
      id-token: write
      attestations: write
