\* One session, every rule: the config to read with /statechart or to run by hand
\* (java -cp tla2tools.jar tlc2.TLC -config ClipboardWatcher.cfg ClipboardWatcher.tla).
\* verify/watcher/check.sh is the gate: it runs each layout and knows which rules
\* are known findings. See .claude/skills/verify-clipboard-watcher/SKILL.md.
SPECIFICATION Spec
CONSTANTS
    Layout = "one"
    Steps = 5
    Images = {"i1", "i2"}
    Mutants = {}
INVARIANT PastedPathExists
INVARIANT PastedPathOnThisHost
INVARIANT NoLocalPathDuringUpload
INVARIANT ReadyPathPastes
INVARIANT NoLostCopy
INVARIANT BoundedWrites
